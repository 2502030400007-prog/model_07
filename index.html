<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple AI Chatbot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat {
      width: 350px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px #aaa;
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    #messages {
      height: 400px;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
    }

    .user {
      background: #dbeafe;
      margin-left: auto;
    }

    .bot {
      background: #eee;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 18px;
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat">
    <div class="header">🤖 Simple AI</div>

    <div id="messages">
      <div class="message bot">
        Hello! I'm a simple AI. Ask me something!
      </div>
    </div>

    <div class="input-area">
      <input id="input" type="text" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function getAIResponse(message) {
      message = message.toLowerCase();

      if (message.includes("hello") || message.includes("hi")) {
        return "Hello! 👋 How are you?";
      }

      if (message.includes("name")) {
        return "I'm Simple AI 🤖";
      }

      if (message.includes("how are you")) {
        return "I'm doing great! Thanks for asking.";
      }

      if (message.includes("html")) {
        return "HTML is used to create the structure of web pages.";
      }

      if (message.includes("javascript") || message.includes("js")) {
        return "JavaScript makes websites interactive.";
      }

      if (message.includes("bye")) {
        return "Goodbye! 👋";
      }

      return "I'm not sure how to answer that yet. 🤔";
    }

    function sendMessage() {
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (text === "") return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;
      messages.appendChild(userMessage);

      const response = getAIResponse(text);

      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      botMessage.textContent = response;
      messages.appendChild(botMessage);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("input").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
